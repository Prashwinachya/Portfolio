<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041419" />
      <stop offset="50%" stop-color="#082329" />
      <stop offset="100%" stop-color="#021114" />
    </linearGradient>
    <linearGradient id="cyan-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow-sec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-sec)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
  </g>

  <circle cx="200" cy="200" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow-sec)" />
  <circle cx="620" cy="220" r="160" fill="#14b8a6" opacity="0.1" filter="url(#glow-sec)" />

  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="16" fill="rgba(6, 24, 28, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <rect width="720" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />

    <rect x="230" y="10" width="260" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="360" y="25" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">voteshield.gov/audit-node</text>

    <!-- Center Security Status Badge -->
    <rect x="36" y="65" width="410" height="140" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    
    <!-- Shield Icon Illustration -->
    <g transform="translate(60, 90)">
      <path d="M 24 4 L 44 12 V 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 V 12 Z" fill="rgba(6, 182, 212, 0.2)" stroke="url(#cyan-teal)" stroke-width="2.5" />
      <path d="M 16 24 L 22 30 L 32 18" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="125" y="105" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Ballot Integrity: 100% Verified</text>
    <text x="125" y="128" fill="#9ca3af" font-size="12" font-family="system-ui, -apple-system, sans-serif">Zero Fraudulent Patterns Detected</text>

    <rect x="125" y="145" width="140" height="24" rx="6" fill="rgba(20, 184, 166, 0.15)" stroke="rgba(20, 184, 166, 0.3)" />
    <text x="195" y="161" fill="#2dd4bf" font-size="10" font-weight="700" font-family="monospace" text-anchor="middle">HASH: 7a8f...39d1</text>

    <!-- Side Metrics -->
    <rect x="466" y="65" width="218" height="66" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="486" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Authenticated Voters</text>
    <text x="486" y="118" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">1,248,590</text>

    <rect x="466" y="139" width="218" height="66" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="486" y="164" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Fraud Prevention Rate</text>
    <text x="486" y="192" fill="#2dd4bf" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">99.998%</text>

    <!-- Bottom Blockchain / Ledger Stream -->
    <rect x="36" y="222" width="648" height="138" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="52" y="248" fill="#9ca3af" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">RECENT AUDIT TRAIL LOGS</text>

    <!-- Row 1 -->
    <rect x="52" y="262" width="616" height="30" rx="6" fill="rgba(255, 255, 255, 0.02)" />
    <circle cx="68" cy="277" r="4" fill="#10b981" />
    <text x="84" y="281" fill="#e2e8f0" font-size="11" font-family="monospace">BLOCK #840,192 • SHA-256 Validated • Signature Match</text>
    <text x="650" y="281" fill="#2dd4bf" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">PASSED</text>

    <!-- Row 2 -->
    <rect x="52" y="300" width="616" height="30" rx="6" fill="rgba(255, 255, 255, 0.02)" />
    <circle cx="68" cy="315" r="4" fill="#10b981" />
    <text x="84" y="319" fill="#e2e8f0" font-size="11" font-family="monospace">BLOCK #840,193 • Biometric Hash Verified • Double-vote Check 0</text>
    <text x="650" y="319" fill="#2dd4bf" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">PASSED</text>
  </g>
</svg>
