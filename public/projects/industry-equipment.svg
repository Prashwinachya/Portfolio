<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-ind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1f" />
      <stop offset="50%" stop-color="#091830" />
      <stop offset="100%" stop-color="#040c1a" />
    </linearGradient>
    <linearGradient id="blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow-ind" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-ind)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <circle cx="240" cy="160" r="150" fill="#3b82f6" opacity="0.12" filter="url(#glow-ind)" />
  <circle cx="600" cy="280" r="150" fill="#06b6d4" opacity="0.1" filter="url(#glow-ind)" />

  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="16" fill="rgba(8, 16, 34, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <rect width="720" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />

    <rect x="230" y="10" width="260" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="360" y="25" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">industry-sys.local/monitor</text>

    <!-- Top KPI cards -->
    <rect x="36" y="65" width="206" height="76" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="52" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Active Machinery</text>
    <text x="52" y="122" fill="#ffffff" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">142 Units</text>
    <rect x="160" y="78" width="66" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" />
    <text x="193" y="92" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">ONLINE</text>

    <rect x="256" y="65" width="206" height="76" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="272" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Operational Uptime</text>
    <text x="272" y="122" fill="#38bdf8" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">99.85%</text>

    <rect x="476" y="65" width="208" height="76" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="492" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Maintenance Health</text>
    <text x="492" y="122" fill="#a7f3d0" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Optimal</text>

    <!-- Main Telemetry & Machinery Grid -->
    <rect x="36" y="155" width="426" height="205" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="52" y="182" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Live Sensor Telemetry</text>

    <!-- Sine Wave / Oscilloscope Telemetry -->
    <path d="M 52 260 C 80 230 110 290 140 250 C 170 210 200 300 230 240 C 260 200 290 280 320 230 C 350 190 380 270 410 220 L 440 250" fill="none" stroke="url(#blue-cyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M 52 300 C 80 280 110 320 140 290 C 170 270 200 310 230 280 C 260 260 290 300 320 270 C 350 250 380 290 410 260 L 440 280" fill="none" stroke="rgba(6, 182, 212, 0.35)" stroke-width="2" stroke-linecap="round" />

    <!-- Right Side Machine Status Cards -->
    <rect x="476" y="155" width="208" height="62" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="496" cy="186" r="6" fill="#10b981" />
    <text x="512" y="180" fill="#ffffff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Turbine Core A1</text>
    <text x="512" y="198" fill="#9ca3af" font-size="10" font-family="system-ui, -apple-system, sans-serif">Temp: 68°C • 3,450 RPM</text>

    <rect x="476" y="227" width="208" height="62" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="496" cy="258" r="6" fill="#06b6d4" />
    <text x="512" y="252" fill="#ffffff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Hydraulic Press B3</text>
    <text x="512" y="270" fill="#9ca3af" font-size="10" font-family="system-ui, -apple-system, sans-serif">Pressure: 240 bar • Normal</text>

    <rect x="476" y="298" width="208" height="62" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="496" cy="329" r="6" fill="#3b82f6" />
    <text x="512" y="323" fill="#ffffff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Conveyor Grid C7</text>
    <text x="512" y="341" fill="#9ca3af" font-size="10" font-family="system-ui, -apple-system, sans-serif">Speed: 1.8 m/s • Synchronized</text>
  </g>
</svg>
