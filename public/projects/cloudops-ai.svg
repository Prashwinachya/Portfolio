<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-cops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1a" />
      <stop offset="50%" stop-color="#0d1430" />
      <stop offset="100%" stop-color="#050817" />
    </linearGradient>
    <linearGradient id="cyan-blue-cops" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow-cops" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-cops)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <circle cx="200" cy="180" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow-cops)" />
  <circle cx="620" cy="240" r="150" fill="#3b82f6" opacity="0.12" filter="url(#glow-cops)" />

  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="16" fill="rgba(10, 16, 36, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <rect width="720" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />

    <rect x="230" y="10" width="260" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="360" y="25" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">cloud-ops-ai-two.vercel.app</text>

    <!-- Top KPI Bar -->
    <rect x="36" y="65" width="206" height="76" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="52" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Active Microservices</text>
    <text x="52" y="122" fill="#ffffff" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">48 Pods</text>
    <rect x="160" y="78" width="66" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" />
    <text x="193" y="92" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">HEALTHY</text>

    <rect x="256" y="65" width="206" height="76" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="272" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">AI Auto-Healing</text>
    <text x="272" y="122" fill="#38bdf8" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Active (99.9%)</text>

    <rect x="476" y="65" width="208" height="76" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="492" y="90" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Avg Response Latency</text>
    <text x="492" y="122" fill="#a7f3d0" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">14.2 ms</text>

    <!-- Node Architecture Visualizer -->
    <rect x="36" y="155" width="426" height="205" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="52" y="182" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Kubernetes Cluster Telemetry</text>

    <!-- Cluster nodes representation -->
    <g transform="translate(60, 205)">
      <!-- Connected lines -->
      <line x1="40" y1="60" x2="160" y2="20" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2" />
      <line x1="40" y1="60" x2="160" y2="100" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2" />
      <line x1="160" y1="20" x2="280" y2="60" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />
      <line x1="160" y1="100" x2="280" y2="60" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />

      <!-- Nodes -->
      <circle cx="40" cy="60" r="16" fill="#06b6d4" />
      <text x="40" y="64" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">API</text>

      <circle cx="160" cy="20" r="14" fill="#3b82f6" />
      <text x="160" y="24" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">N1</text>

      <circle cx="160" cy="100" r="14" fill="#3b82f6" />
      <text x="160" y="104" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">N2</text>

      <circle cx="280" cy="60" r="16" fill="#10b981" />
      <text x="280" y="64" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">DB</text>
    </g>

    <!-- Right Side AI Event Logs -->
    <rect x="476" y="155" width="208" height="62" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="496" cy="186" r="6" fill="#10b981" />
    <text x="512" y="180" fill="#ffffff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">AI Load Balancer</text>
    <text x="512" y="198" fill="#9ca3af" font-size="10" font-family="system-ui, -apple-system, sans-serif">Traffic distributed to us-east</text>

    <rect x="476" y="227" width="208" height="62" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="496" cy="258" r="6" fill="#06b6d4" />
    <text x="512" y="252" fill="#ffffff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Predictive Auto-scale</text>
    <text x="512" y="270" fill="#9ca3af" font-size="10" font-family="system-ui, -apple-system, sans-serif">+3 Pods spun before surge</text>

    <rect x="476" y="298" width="208" height="62" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="496" cy="329" r="6" fill="#8b5cf6" />
    <text x="512" y="323" fill="#ffffff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Threat Intelligence</text>
    <text x="512" y="341" fill="#9ca3af" font-size="10" font-family="system-ui, -apple-system, sans-serif">0 Vulnerabilities detected</text>
  </g>
</svg>
