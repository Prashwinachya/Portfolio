<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-car" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160805" />
      <stop offset="50%" stop-color="#260f09" />
      <stop offset="100%" stop-color="#120603" />
    </linearGradient>
    <linearGradient id="orange-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow-car" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-car)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
  </g>

  <circle cx="220" cy="180" r="150" fill="#f97316" opacity="0.12" filter="url(#glow-car)" />
  <circle cx="620" cy="240" r="160" fill="#ec4899" opacity="0.1" filter="url(#glow-car)" />

  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="16" fill="rgba(24, 12, 10, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <rect width="720" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />

    <rect x="230" y="10" width="260" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="360" y="25" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">career-guidance.vercel.app</text>

    <!-- Header Recommendation Card -->
    <rect x="36" y="65" width="410" height="110" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="56" y="94" fill="#fb923c" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">TOP CAREER RECOMMENDATION</text>
    <text x="56" y="126" fill="#ffffff" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Full-Stack Cloud Architect</text>
    
    <rect x="56" y="140" width="80" height="22" rx="11" fill="rgba(249, 115, 22, 0.2)" />
    <text x="96" y="155" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">98% Match</text>

    <!-- Side Match Rate Box -->
    <rect x="466" y="65" width="218" height="110" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="486" y="94" fill="#9ca3af" font-size="11" font-family="system-ui, -apple-system, sans-serif">Average Starting Range</text>
    <text x="486" y="126" fill="#ffffff" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">$120K - $160K</text>
    <text x="486" y="152" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">High Industry Demand ↑</text>

    <!-- Roadmap Milestones Progress -->
    <rect x="36" y="192" width="648" height="168" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="56" y="222" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Personalized Milestone Roadmap</text>

    <!-- Steps -->
    <g transform="translate(56, 246)">
      <!-- Line -->
      <line x1="20" y1="20" x2="560" y2="20" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="20" y1="20" x2="380" y2="20" stroke="url(#orange-pink)" stroke-width="3" />

      <!-- Step 1 -->
      <circle cx="20" cy="20" r="14" fill="#f97316" />
      <text x="20" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓</text>
      <text x="20" y="52" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Foundations</text>
      <text x="20" y="66" fill="#9ca3af" font-size="9" text-anchor="middle">Data Structures</text>

      <!-- Step 2 -->
      <circle cx="200" cy="20" r="14" fill="#fb923c" />
      <text x="200" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓</text>
      <text x="200" y="52" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Frameworks</text>
      <text x="200" y="66" fill="#9ca3af" font-size="9" text-anchor="middle">React &amp; Node.js</text>

      <!-- Step 3 -->
      <circle cx="380" cy="20" r="14" fill="#ec4899" />
      <text x="380" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">⚡</text>
      <text x="380" y="52" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Cloud Systems</text>
      <text x="380" y="66" fill="#f472b6" font-size="9" text-anchor="middle">In Progress (80%)</text>

      <!-- Step 4 -->
      <circle cx="560" cy="20" r="14" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.3)" />
      <text x="560" y="24" fill="#9ca3af" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <text x="560" y="52" fill="#9ca3af" font-size="11" font-weight="600" text-anchor="middle">System Design</text>
      <text x="560" y="66" fill="#6b7280" font-size="9" text-anchor="middle">Next Goal</text>
    </g>
  </g>
</svg>
